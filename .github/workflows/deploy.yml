name: Deploy Production
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail --silent --show-error --request POST             --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"             --header "Content-Type: application/json"             --data '{"clearCache":"do_not_clear"}'             "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys"
